<!DOCTYPE html>
<html>
<head>
<title>Codmax Blog - Gulshan</title>
<style>
body{font-family:Arial;max-width:900px;margin:auto;padding:20px;background:#f5f5f5}
.card{background:white;padding:15px;margin:10px 0;border-radius:10px;box-shadow:0 2px 5px #ccc}
input,textarea,select{width:95%;padding:8px;margin:5px 0}
button{padding:8px 15px;background:black;color:white;border:none;border-radius:5px;cursor:pointer}
.top{display:flex;justify-content:space-between;align-items:center}
.hidden{display:none}
</style>
</head>
<body>
<div class="top">
<h2>Codmax Blog</h2>
<div>
<span id="userName"></span>
<button id="logoutBtn" class="hidden" onclick="logout()">Logout</button>
</div>
</div>

<div id="authBox" class="card">
<h3 id="authTitle">Login</h3>
<input id="nameInp" placeholder="Name (only for signup)" class="hidden">
<input id="emailInp" placeholder="Email">
<input id="passInp" type="password" placeholder="Password">
<button onclick="handleAuth()">Login</button>
<p><a href="#" onclick="toggleAuth()">Create Account? Signup</a></p>
</div>

<div id="dashBox" class="hidden">
<div class="card">
<h3>Create Blog</h3>
<input id="title" placeholder="Blog Title">
<textarea id="content" placeholder="Content"></textarea>
<input id="image" placeholder="Image URL (optional)">
<select id="category"><option>General</option><option>Tech</option><option>Travel</option><option>Food</option></select>
<button onclick="createBlog()">Post Blog</button>
</div>

<div class="card">
<input id="search" placeholder="Search title..." onkeyup="loadBlogs()">
<select id="filterCat" onchange="loadBlogs()"><option>All</option><option>General</option><option>Tech</option><option>Travel</option><option>Food</option></select>
</div>
<div id="blogs"></div>
</div>

<script>
const API = "http://localhost:5000/api";
let isLogin = true;
function toggleAuth(){
 isLogin = !isLogin;
 document.getElementById("authTitle").innerText = isLogin ? "Login" : "Signup";
 document.getElementById("nameInp").classList.toggle("hidden", isLogin);
}

async function handleAuth(){
 const email = document.getElementById("emailInp").value;
 const password = document.getElementById("passInp").value;
 const name = document.getElementById("nameInp").value;
 const url = isLogin ? `${API}/auth/login` : `${API}/auth/register`;
 const body = isLogin ? {email,password} : {name,email,password};
 const res = await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
 const data = await res.json();
 if(data.token){ localStorage.setItem("token", data.token); localStorage.setItem("name", data.user.name); checkLogin(); }
 else if(data.msg){ alert(data.msg); if(!isLogin){ toggleAuth(); } }
 else alert("Done! Now Login");
}

function checkLogin(){
 const token = localStorage.getItem("token");
 if(token){
  document.getElementById("authBox").classList.add("hidden");
  document.getElementById("dashBox").classList.remove("hidden");
  document.getElementById("logoutBtn").classList.remove("hidden");
  document.getElementById("userName").innerText = "Hi, " + localStorage.getItem("name");
  loadBlogs();
 } else {
  document.getElementById("authBox").classList.remove("hidden");
  document.getElementById("dashBox").classList.add("hidden");
 }
}
function logout(){ localStorage.clear(); checkLogin(); }

async function loadBlogs(){
 const s = document.getElementById("search").value;
 const c = document.getElementById("filterCat").value;
 const res = await fetch(`${API}/blogs?search=${s}&category=${c}`);
 const blogs = await res.json();
 document.getElementById("blogs").innerHTML = blogs.map(b=>`
  <div class="card">
   <h3>${b.title}</h3>
   <p>By: ${b.user?.name || 'Unknown'} | ${b.category}</p>
   <p>${b.content}</p>
   ${b.image ? `<img src="${b.image}" style="width:100%;max-height:200px;object-fit:cover">` : ''}
   <br><button onclick="deleteBlog('${b._id}')">Delete</button>
  </div>`).join('');
}
async function createBlog(){
 const token = localStorage.getItem("token");
 const data = { title:title.value, content:content.value, image:image.value, category:category.value };
 const res = await fetch(`${API}/blogs`, {method:"POST", headers:{"Content-Type":"application/json","Authorization":"Bearer "+token}, body:JSON.stringify(data)});
 if(res.ok){ alert("Posted!"); title.value=""; content.value=""; loadBlogs(); } else alert("Login first");
}
async function deleteBlog(id){
 const token = localStorage.getItem("token");
 await fetch(`${API}/blogs/${id}`, {method:"DELETE", headers:{"Authorization":"Bearer "+token}});
 loadBlogs();
}
checkLogin();
</script>
</body>
</html>
